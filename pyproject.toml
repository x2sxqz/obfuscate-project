[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lua-obf"
version = "0.9.0"
description = "A from-scratch Lua/Luau obfuscator: renaming, string/number obfuscation, control-flow flattening, and an optional bytecode VM for closed functions."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
lua-obf = "lua_obf.cli:main"

[tool.setuptools]
packages = ["lua_obf", "lua_obf.transforms"]
